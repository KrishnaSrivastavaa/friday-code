
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kryx"
version = "0.1.0"
description = "A terminal-based AI coding agent"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.141.1",
    "ipython>=9.17.1",
    "openai>=3.37.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.53",
    "sqlmodel>=0.0.42",
    "supabase>=2.31.0",
    "tiktoken>=0.14.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
kryx = "my_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = ["eval: end-to-end evaluation that calls the LLM (opt-in)"]
