[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "ipython>=9.17.1",
    "openai>=3.37.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.53",
    "sqlmodel>=0.0.42",
    "supabase>=2.31.0",
    "tiktoken>=0.14.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "eval: end-to-end evaluation that calls the LLM (opt-in)",
]
